<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartWays BMS</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    /* Same tokens as PARTWAYS-PORTAL css/base.css. */
    :root {
      --surface: #fcfcfb; --panel: #ffffff; --line: #e4e2dc;
      --ink: #17161c; --ink-2: #47454f; --muted: #6b6975; --accent: #3f3a8c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--surface); color: var(--ink);
      font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .brand img { width: 28px; height: 28px; }
    h1 { font-size: 1.25rem; margin: 24px 0 8px; }
    p { margin: 0; color: var(--ink-2); }
    .note { margin-top: 24px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/favicon.svg" alt="">PartWays BMS</div>
    <h1>Back-office</h1>
    <p>The PartWays back-office is being set up. Sign-in and tools for the PartWays team will appear here.</p>
    <p class="note">For the PartWays website, go to <a href="https://partways.org">partways.org</a>.</p>
  </main>
</body>
</html>
